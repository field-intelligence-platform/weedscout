name: tests

# Private repo on the free plan: 2,000 Actions minutes a month, with macOS minutes counted 10x and
# Windows 2x. Everyday work (develop, feature branches) runs a quick Linux check; the full
# OS x Python matrix runs only for what goes into main (release pull requests, main, manual runs).
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  quick:
    name: ubuntu-latest / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install from a clean environment
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: CLI is installed
        run: weedscout --help
      - name: Run the offline test suite
        run: pytest -q

  full:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install from a clean environment
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: CLI is installed
        run: weedscout --help
      - name: Run the offline test suite
        run: pytest -q
