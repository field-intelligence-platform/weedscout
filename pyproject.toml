[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weedscout"
version = "1.2.0"
description = "Within-field low-vigour scouting maps from Sentinel-2 (scouting priority, not weed detection)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gowtham Uppalapati" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.15",
    "rasterio>=1.3.9",
    "geopandas>=1.0",
    "pyogrio>=0.7",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
weedscout = "weedscout.cli:main"
weedscout-visit-kit = "weedscout.visit:kit_main"
weedscout-score-visits = "weedscout.visit:score_main"
weedscout-history = "weedscout.history:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
